[project]
name = "pd-xray"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fabio>=2025.10.0",
    "numpy>=2.4.4",
    "pydantic>=2.12.5",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
    "zarr>=3.1.6",
]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "types-pyyaml>=6.0.12.20260408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pd_xray"]
