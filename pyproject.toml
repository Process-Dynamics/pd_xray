[project]
name = "pd-xray"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dask>=2026.3.0",
    "fabio>=2025.10.0",
    "matplotlib>=3.10.8",
    "numpy<2.0",  # Requirement for CIL
    "pydantic>=2.12.5",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "scikit-learn>=1.6.0",
    "tqdm>=4.67.3",
    "zarr==3.1.5",  # Specific version because numpy req is updated at 3.1.6
    "pandas>=2.3.3",
    "plotly>=6.7.0",
    "nbformat>=5.10.4",
    "ipykernel>=7.2.0",
    "pyvista>=0.47.3",
    "connected-components-3d>=3.26.1",
]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "scipy-stubs>=1.17.1.4",
    "types-pyyaml>=6.0.12.20260408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pd_xray"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (run with -m slow)",
]
