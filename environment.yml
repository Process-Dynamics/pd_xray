name: pd-xray
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy=1.26.4
  - h5py=3.16.0
  - hdf5plugin=7.1.0
  - tifffile=2025.5.10
  - imagecodecs=2026.8.16      # via tifffile; conda-forge build runs on NumPy 1.26 (pip check warns: upstream says >=2.1)
  - pillow=12.3.0
  - scipy=1.15.2
  - scikit-image=0.25.2
  - pyyaml=6.0.3
  - fastapi-core=0.142.2
  - uvicorn=0.54.0
  - websockets=16.1.1
  - asyncssh=2.24.0
  - boto3=1.43.114
  - pip
  - pip:
      - ./packages/pd-xray-core
      - ./packages/pd-xray-storage[all]
      - ./packages/pd-xray-io[all]
      - ./packages/pd-xray-processing
      - ./packages/pd-xray-server
