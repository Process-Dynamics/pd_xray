[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pd-xray-server"
version = "0.1.0"
description = "Web application server for pd_xray."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pd-xray-core", "pd-xray-storage", "pd-xray-io[all]", "pd-xray-processing"]

[tool.hatch.build.targets.wheel]
packages = ["src/pd_xray"]
