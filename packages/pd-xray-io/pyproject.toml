[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pd-xray-io"
version = "0.1.0"
description = "File format readers/writers and lazy datasets for pd_xray."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pd-xray-core~=0.1.0"]

[project.optional-dependencies]
hdf5 = ["h5py>=3.10,<4", "hdf5plugin>=4.4"]
tiff = ["tifffile>=2024.9.20"]
png = ["pillow>=10.1"]
all = ["pd-xray-io[hdf5,tiff,png]"]

[tool.hatch.build.targets.wheel]
packages = ["src/pd_xray"]
