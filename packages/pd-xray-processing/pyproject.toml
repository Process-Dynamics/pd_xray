[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pd-xray-processing"
version = "0.2.0"
description = "Image processing operations and pipelines for pd_xray."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pd-xray-core~=0.2.0",
    "numpy>=1.26.4,<2",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "pyyaml>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pd_xray"]
