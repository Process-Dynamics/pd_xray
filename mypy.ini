[mypy]
python_version = 3.10
strict = True
files = packages/*/src
mypy_path = packages/pd-xray-core/src, packages/pd-xray-storage/src, packages/pd-xray-io/src, packages/pd-xray-processing/src, packages/pd-xray-server/src
explicit_package_bases = True
# scikit-image ships py.typed but leaves many functions unannotated.
untyped_calls_exclude = skimage

# No type stubs shipped.
[mypy-scipy.*,yaml.*]
ignore_missing_imports = True
